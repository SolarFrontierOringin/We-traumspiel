<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Solar Frontier: Origins – v0.8 FIX</title>
  <meta name="theme-color" content="#02050b">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header>
      <div>
        <h1>🚀 Solar Frontier: Origins</h1>
        <div class="hint">Sonnensystem · Rohstoffe · Aufbau · Transport · <strong>v0.8 FIX</strong></div>
      </div>
      <button id="save-menu-button" class="small-button">💾 Spiel</button>
    </header>

    <div id="top-resources" class="top-resources"></div>

    <section id="save-menu" class="save-menu" hidden>
      <div class="save-menu-head">
        <strong>💾 Spielstand</strong>
        <button id="save-menu-close" class="icon-button">✕</button>
      </div>
      <div class="save-buttons">
        <button id="save-game">Speichern</button>
        <button id="load-game">Laden</button>
        <button id="restart-game" class="danger">Neustart</button>
      </div>
      <div id="save-status" class="save-status"></div>
    </section>

    <section class="game-layout">
      <div class="solar-system-viewport" aria-label="Scrollbare Galaxie">
        <div id="solar-system" class="solar-system" aria-label="Sonnensystem"></div>
      </div>
      <aside id="info-panel" class="panel"></aside>
    </section>
  </main>
  <script src="game.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(()=>{});</script>
</body>
</html>
